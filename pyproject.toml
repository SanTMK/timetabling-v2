[project]
name = "timetabling"
version = "0.9.0rc1"
description = "Generador y editor de horarios escolares sin conexión (preescolar, primaria y secundaria)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.12",
    "ortools>=9.15",
    "pydantic>=2",
    "XlsxWriter>=3.3",
    "openpyxl",
    "typer",
]

[project.scripts]
timetabling = "timetabling.cli:principal"

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "hypothesis",
    "ruff",
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timetabling"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "pruebas"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
addopts = "-ra --strict-markers"
# Si una prueba se cuelga, se vuelcan las pilas de todos los hilos (diagnóstico en el CI).
faulthandler_timeout = 300
markers = [
    "lento: pruebas de punta a punta que tardan (se excluyen de la suite rápida)",
    "rendimiento: mide tiempos contra los umbrales de §2",
]
